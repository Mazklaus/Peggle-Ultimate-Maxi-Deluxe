<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ricochet Céleste · banc d'écoute</title>
    <style>
      :root {
        color-scheme: dark;
        --fond: #0b1026;
        --carte: #141b3d;
        --bord: #232a5c;
        --texte: #f4f1ff;
        --doux: #a9b0e0;
        --coeur: #ffb23f;
        --pip: #ffe45c;
      }
      body {
        margin: 0;
        background: var(--fond);
        color: var(--texte);
        font:
          15px/1.5 system-ui,
          sans-serif;
        padding: 16px;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin: 8px 0 4px;
      }
      p {
        color: var(--doux);
        margin: 0 0 16px;
      }
      section {
        background: var(--carte);
        border: 1px solid var(--bord);
        border-radius: 14px;
        padding: 12px 14px 14px;
        margin-bottom: 14px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 10px;
        color: var(--pip);
      }
      .grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        background: var(--bord);
        color: var(--texte);
        border: 1px solid #3b438a;
        border-radius: 999px;
        padding: 7px 14px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--coeur);
      }
      button.on {
        background: var(--coeur);
        color: #1b1300;
      }
      label {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        margin-right: 16px;
        color: var(--doux);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Banc d'écoute audio · jalon 1</h1>
      <p>
        Tout est synthétisé en direct (Web Audio), aucun fichier son. Cliquez une première fois pour
        activer l'audio.
      </p>
      <div id="app"></div>
    </main>
    <script type="module" src="/src/sons.ts"></script>
  </body>
</html>
